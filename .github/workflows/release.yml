name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for changelog

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version
        id: version
        run: |
          NEW_VERSION=$(node scripts/version.mjs ${{ inputs.bump }})
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          NOTES=$(node scripts/changelog.mjs ${{ steps.version.outputs.version }})
          # Write to file for gh release
          echo "$NOTES" > /tmp/release-notes.md

      - name: Build
        run: pnpm build

      - name: Verify release ZIP
        run: |
          ZIP_FILE="release/crx-linear-web-clipper-${{ steps.version.outputs.version }}.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Release ZIP not found at $ZIP_FILE"
            exit 1
          fi
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
        id: zip

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin main --follow-tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "${{ steps.zip.outputs.zip_file }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md

      # TODO: Add Chrome Web Store auto-publish when CWS API credentials are available
      # See: https://developer.chrome.com/docs/webstore/using-api
